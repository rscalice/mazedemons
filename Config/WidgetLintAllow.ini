; WidgetLint allowlist (read by UMD_WidgetLintLibrary::LoadAllowlist).
;
; One entry per line:   Asset | Rule | Reason
;   Asset  long package name (/Game/UI/Menus/W_Pause) or a bare asset name (W_Pause)
;   Rule   L1 .. L8, or * for every rule
;   Reason required; entries without one are ignored (and logged)
; Lines starting with ; or # are comments. Keep this list short: an entry is a promise to fix it, so link the issue.
;
; Example:
; /Game/UI/Menus/W_Pause | L7 | unused variable kept for the pause options work (#NNN)

/Game/Blueprints/UI/Inventory/W_Inventory | L6 | live paper doll; legacy list entry outdated
/Game/UI/Menus/W_MDPerkNode | L7 | OnNodeFocused dispatcher is broadcast in BroadcastFocus; lint does not count call-delegate nodes
